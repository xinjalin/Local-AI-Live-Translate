<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import configs · Local AI Live Translate</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="import.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page">
  <!-- Importing lives on its own page: a file picker would close the extension popup. -->
  <div class="page-wrap">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="4 16 120 96" width="44" height="35" aria-hidden="true">
          <defs>
            <linearGradient id="logo-left" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--logo-left-a)"/>
              <stop offset="1" style="stop-color: var(--logo-left-b)"/>
            </linearGradient>
            <clipPath id="logo-card"><rect x="4" y="16" width="120" height="96" rx="20"/></clipPath>
          </defs>
          <g clip-path="url(#logo-card)">
            <rect x="4" y="16" width="120" height="96" style="fill: var(--logo-right)"/>
            <polygon points="0,16 51,16 74,112 0,112" fill="url(#logo-left)"/>
          </g>
          <rect x="5" y="17" width="118" height="94" rx="19" fill="none" style="stroke: var(--logo-edge)" stroke-width="2"/>
          <path style="fill: var(--logo-a)" fill-rule="evenodd" d="M18.5 88 L28.8 40 L39.2 40 L49.5 88 L41.3 88 L39 77 L29 77 L26.7 88 Z M30.6 69.5 L37.4 69.5 L34 52 Z"/>
          <g fill="none" style="stroke: var(--logo-wen)" stroke-width="8">
            <path d="M94 36v12"/><path d="M77 50h34"/><path d="M104 54 C 99 68 91 78 79 87"/><path d="M85 63 C 92 73 100 80 110 87"/>
          </g>
        </svg>
        <div>
          <h1 data-i18n="importTitle">Import configs</h1>
          <p class="tagline">Local AI Live Translate</p>
        </div>
      </div>
    </header>

    <!-- 1. Pick a file -->
    <section class="panel" id="pick-panel">
      <p class="page-text" data-i18n="importIntro">Choose a configs file exported from Local AI Live Translate.</p>
      <label class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".json,application/json" hidden>
        <span class="btn btn-start drop-button" data-i18n="importChoose">Choose file</span>
        <span class="hint" data-i18n="importDrop">or drop it here</span>
      </label>
      <div class="hint error" id="file-error" hidden></div>
    </section>

    <!-- 2. Preview and choose what to import -->
    <section class="page-section" id="items" hidden>
      <div class="panel" id="profiles-panel" hidden>
        <div class="panel-title" data-i18n="importProfiles">Profiles</div>
        <div class="hint" id="lm-note" hidden></div>
        <div class="import-list" id="profile-items"></div>
      </div>
      <div class="panel" id="display-panel" hidden>
        <div class="panel-title" data-i18n="importDisplayConfigs">Display configs</div>
        <div class="import-list" id="display-items"></div>
      </div>
      <button type="button" class="btn btn-start" id="import-btn" data-i18n="importButton">Import selected</button>
      <div class="hint error" id="import-error" hidden></div>
    </section>

    <!-- 3. Done -->
    <section class="panel" id="done-panel" hidden>
      <p class="page-text" id="done-text"></p>
      <p class="hint" data-i18n="importDownloadsContinue">Downloads keep going in LM Studio if you close this tab.</p>
      <button type="button" class="btn btn-start" id="close-btn" data-i18n="importCloseTab">Close tab</button>
    </section>

    <footer class="footer" data-i18n="footerText">100% Offline Privacy Protection • xinjalin</footer>
  </div>
  <script src="i18n.js"></script>
  <script src="subtitle-styles.js"></script>
  <script src="lmstudio-api.js"></script>
  <script src="cloud.js"></script>
  <script src="theme.js"></script>
  <script src="import.js"></script>
</body>
</html>
